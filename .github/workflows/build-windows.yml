name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build (tests, PyInstaller, Setup.exe)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-Setup
          path: installer_output/MediaDownloader-Setup.exe

      - name: Attach installer to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/MediaDownloader-Setup.exe
